[project]
name = "medimind"
version = "0.1.0"
description = "Evidence-linked personal medical record intelligence platform (prototype)."
readme = "README.md"
# Python 3.12 only, until a future compatibility review (ADR-026).
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.1",
    "pgvector>=0.5.1",
    "psycopg[binary]>=3.3.9",
    "pydantic-settings>=2.16.2",
    "sqlalchemy>=2.1.8",
]

[tool.uv]
# MediMind is an application, not a library to publish: uv should not build or install
# `app/` as a package. Imports work because commands run from the project root.
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
# Make `import app...` work in tests without installing the project.
pythonpath = ["."]
# -ra: summary of skipped/failed tests; --strict-markers: typos in markers are errors.
# Integration tests need the real database and are opt-in: `uv run pytest -m integration`.
addopts = "-ra --strict-markers -m 'not integration'"
markers = [
    "integration: needs the running PostgreSQL container (opt-in, read-only)",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
# E/F: pycodestyle + pyflakes errors, I: import sorting, UP: modern syntax, B: likely bugs.
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Frozen migrations keep each CHECK constraint's SQL as one unbroken literal, so it can be compared
# with app/records/models.py at a glance.
"migrations/versions/*.py" = ["E501"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]
