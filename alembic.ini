# Alembic configuration for MediMind (Task 1.7).
#
# There is deliberately NO sqlalchemy.url here: credentials never go into this file or into
# Alembic's config. migrations/env.py builds the engine from the application settings (.env) with
# the same sanitized helper the app uses (app/records/db.py).
#
# Apply migrations:   uv run python -m app migrate        (upgrade only; sanitized errors)
# Inspect:            uv run alembic current | history | check
# Preview SQL:        uv run alembic upgrade head --sql   (offline, no database needed)
# Downgrade:          uv run alembic downgrade <revision> (DESTROYS DATA; see README)

[alembic]
script_location = %(here)s/migrations
# Make `import app...` work when running the alembic command from the project root.
prepend_sys_path = .
path_separator = os
file_template = %%(rev)s_%%(slug)s
truncate_slug_length = 40
